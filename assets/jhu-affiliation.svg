<svg width="360" height="84" viewBox="0 0 360 84" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Johns Hopkins University affiliation mark</title>
  <desc id="desc">A blue and white text affiliation mark for Johns Hopkins University and Computer Science.</desc>
  <rect width="360" height="84" rx="8" fill="#002D72"/>
  <rect x="16" y="16" width="52" height="52" rx="6" fill="#FFFFFF"/>
  <text x="42" y="50" text-anchor="middle" fill="#002D72" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" letter-spacing="0">JHU</text>
  <text x="86" y="36" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800" letter-spacing="0.5">Johns Hopkins University</text>
  <text x="86" y="58" fill="#B9D8F2" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2">COMPUTER SCIENCE</text>
</svg>
